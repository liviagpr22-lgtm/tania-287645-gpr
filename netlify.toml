[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node netlify/preparar.js"

[functions]
  included_files = ["server/schema.sql", "produtos.json"]

[build.environment]
  NODE_VERSION = "22.16.0"
  NODE_ENV = "production"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/Produtos_imagens/uploads/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
